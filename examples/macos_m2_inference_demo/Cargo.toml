[package]
name = "macos_m2_inference_demo"
version = "0.1.0"
edition = "2021"
description = "SymBrain v3 macOS M2 UMA & Metal performance simulation engine"
license = "LicenseRef-RunuX-Commercial"

[dependencies]
ai_runtime = { path = "../../crates/ai_runtime" }
hal = { path = "../../crates/hal" }
rvv_simd = { path = "../../crates/rvv_simd" }
turbo_quant = { path = "../../crates/turbo_quant" }
federated = { path = "../../crates/federated" }

[features]
default = ["std"]
std = []

# Note: Profile configuration is managed by the workspace root Cargo.toml.
# Per-package [profile.*] sections are silently ignored by Cargo workspaces.
# See: https://doc.rust-lang.org/cargo/reference/workspaces.html
# (AUDIT2_REPORT §4.1 fix)
