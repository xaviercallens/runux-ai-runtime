[package]
name = "edge_inference_demo"
version = "0.1.0"
edition = "2021"
description = "SymBrain v3 Edge Co-Inference Quantization & Execution Engine"
license = "MIT"

[dependencies]
ai_runtime = { path = "../../crates/ai_runtime" }
rvv_simd = { path = "../../crates/rvv_simd" }
turbo_quant = { path = "../../crates/turbo_quant" }
federated = { path = "../../crates/federated" }

[features]
default = ["std"]
std = []

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
