[workspace]
resolver = "2"
members = [
    "crates/ai_runtime",
    "crates/rvv_simd",
    "crates/turbo_quant",
    "crates/ai_bridge",
    "crates/federated",
    "crates/gguf_loader",
    "crates/tokenizer",
    "crates/transformer",
    "crates/k3_a100",
    "crates/gpu_compute",
    "crates/flash_attention",
    "crates/arena_mem",
    "crates/speculative",
    "crates/power_monitor",
    "crates/perf_model",
    "crates/sim_bench",
    "crates/sim_inference",
    "crates/sim_train",
    "crates/hal",
    "crates/tpu_pjrt",
    "crates/stablehlo",
    "crates/mlgo_advisor",
    "crates/framework_bridge",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Xavier Callens <xavier.callens@socrate.ai>"]
license = "LicenseRef-RunuX-Commercial"
repository = "https://github.com/xaviercallens/runux-ai-runtime"

[package]
name = "runux-report"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-RunuX-Commercial"
description = "RunuX AI Runtime — Simulation report generator CLI"

[[bin]]
name = "runux-report"
path = "src/main.rs"

[dependencies]
ai_runtime = { path = "crates/ai_runtime" }
perf_model = { path = "crates/perf_model" }
power_monitor = { path = "crates/power_monitor" }
sim_inference = { path = "crates/sim_inference" }
sim_train = { path = "crates/sim_train" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
