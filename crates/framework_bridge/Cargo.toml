[package]
name = "framework_bridge"
version = "0.1.0"
edition = "2021"
description = "RunuX Framework Bridge — C FFI for PyTorch, TensorFlow, JAX integration"
license = "LicenseRef-RunuX-Commercial"

[dependencies]
hal = { path = "../hal" }
gpu_compute = { path = "../gpu_compute" }

[lib]
crate-type = ["lib", "cdylib"]

[dev-dependencies]
arena_mem = { path = "../arena_mem" }
flash_attention = { path = "../flash_attention" }
turbo_quant = { path = "../turbo_quant" }
ai_runtime = { path = "../ai_runtime" }
