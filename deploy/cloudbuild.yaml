# ═══════════════════════════════════════════════════════════════════════
# SymBrain v4 — Google Cloud Build configuration
# Build → Push to Artifact Registry → Deploy to Cloud Run (with GPU)
# ═══════════════════════════════════════════════════════════════════════

substitutions:
  _REGION: europe-west1
  _REPOSITORY: symbrain-registry
  _SERVICE_NAME: symbrain-v4
  _MODEL_TIER: "14b"
  _MAX_INSTANCES: "4"
  _MIN_INSTANCES: "0"
  _MEMORY: "16Gi"
  _CPU: "4"
  _GPU_TYPE: nvidia-l4
  _GPU_COUNT: "1"
  _TIMEOUT: "900"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── Step 1: Build the Docker image ──────────────────────────────────
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/Dockerfile.v4
      - --build-arg=MODEL_TIER=${_MODEL_TIER}
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  # ── Step 2: Push to Artifact Registry ───────────────────────────────
  - id: push-image
    name: gcr.io/cloud-builders/docker
    waitFor: [build-image]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}

  # ── Step 3: Deploy to Cloud Run ─────────────────────────────────────
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-image]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --gpu=${_GPU_COUNT}
      - --gpu-type=${_GPU_TYPE}
      - --max-instances=${_MAX_INSTANCES}
      - --min-instances=${_MIN_INSTANCES}
      - --timeout=${_TIMEOUT}
      - --set-env-vars=MODEL_TIER=${_MODEL_TIER},PYTHONUNBUFFERED=1,HF_HOME=/app/model_cache
      - --execution-environment=gen2
      - --concurrency=1
      - --no-cpu-throttling

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

timeout: 1800s
