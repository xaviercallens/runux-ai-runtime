name: RunuX AI Runtime CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build, Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64gc-unknown-none-elf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check (host)
        run: cargo check --workspace

      - name: Check (RISC-V cross-compile)
        run: cargo check --workspace --target riscv64gc-unknown-none-elf

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings || true

      - name: Test (host)
        run: cargo test --workspace --lib

  license-audit:
    name: License & Copyright Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify proprietary headers
        run: |
          echo "Checking all .rs files have proprietary copyright header..."
          MISSING=0
          for f in $(find crates -name "*.rs"); do
            if ! head -1 "$f" | grep -q "Copyright (c) 2026 Xavier Callens"; then
              echo "MISSING HEADER: $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING files missing proprietary copyright header"
            exit 1
          fi
          echo "All files have proper copyright headers ✅"

      - name: Verify no GPL references
        run: |
          echo "Checking for accidental GPL license references..."
          if grep -r "GPL" crates/ --include="*.rs" --include="*.toml" | grep -v "LicenseRef"; then
            echo "WARNING: Found GPL references in proprietary crates"
            exit 1
          fi
          echo "No GPL contamination found ✅"

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Run security audit
        run: cargo audit || true
